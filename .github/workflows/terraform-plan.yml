name: Terraform Plan (PR)

on:
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure AWS (OIDC)
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init with remote backend
        if: github.actor != 'dependabot[bot]'
        run: terraform init -reconfigure

      - name: Terraform Init without remote backend
        if: github.actor == 'dependabot[bot]'
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.0

      - name: Checkov
        # These checks require production services or TLS resources intentionally omitted from this portfolio lab.
        run: >-
          checkov -d .
          --framework terraform
          --skip-path .terraform
          --skip-check CKV2_AWS_20,CKV_AWS_378,CKV2_AWS_11,CKV_AWS_103,CKV2_AWS_28
          --compact
          --quiet

      - name: Terraform Plan (dev)
        run: terraform plan -var-file=env/dev.tfvars
        if: github.actor != 'dependabot[bot]'
